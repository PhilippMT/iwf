# Prometheus Configuration for iWF Java Server

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # iWF Java Server metrics
  - job_name: 'iwf-server'
    static_configs:
      - targets: ['iwf-server-java:9090']
    metrics_path: /actuator/prometheus

  # Temporal server metrics (if exposed)
  - job_name: 'temporal'
    static_configs:
      - targets: ['temporal:9090']
    metrics_path: /metrics
